<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>生日快乐</title>
<style>
body{
    margin:0;
    padding:0;
    background:linear-gradient(135deg,#ffd6e0,#ffe6f2);
    min-height:100vh;
    font-family:"微软雅黑","苹方",sans-serif;
    overflow-x:hidden;
}
* {
    font-family: "幼圆", "圆体", "微软雅黑", sans-serif !important;
}
.page{
    width:100vw;
    height:100vh;
    display:flex;
    justify-content:center;
    align-items:center;
    flex-direction:column;
    position:relative;
    transition: opacity 1s ease;
    opacity: 1;
    overflow: hidden;
}
#page2,#page3,#page4{
    display:none;
    opacity: 0;
}

/* 漂浮彩带 全局每页生效 */
.confetti {
    position: absolute;
    width: 8px;
    height: 25px;
    border-radius: 2px;
    opacity: 0.7;
    animation: confettiFall linear infinite;
    z-index: 1;
}
@keyframes confettiFall {
    0% {
        transform: translateY(-30px) rotate(0deg);
        opacity: 0;
    }
    10% { opacity: 0.8; }
    90% { opacity: 0.7; }
    100% {
        transform: translateY(100vh) rotate(360deg);
        opacity: 0;
    }
}

/* 漂浮蝴蝶结 */
.fly-bow{
    position:absolute;
    width:35px;
    height:35px;
    background:#ff99bb;
    opacity:0.7;
    clip-path:polygon(0 50%,25% 0,50% 50%,75% 0,100% 50%,75% 100%,50% 50%,25% 100%);
    animation: float 6s ease-in-out infinite;
    pointer-events:none;
}
@keyframes float{
    0%{transform:translateY(0) rotate(0deg);}
    50%{transform:translateY(-20px) rotate(8deg);}
    100%{transform:translateY(0) rotate(0deg);}
}

/* 星星闪光特效 */
.star{
    position: absolute;
    width: 6px;
    height: 6px;
    background: #fff;
    border-radius: 50%;
    opacity: 0;
    pointer-events: none;
    animation: starShine 3s ease-in-out infinite;
}
@keyframes starShine{
    0%,100%{opacity: 0; transform: scale(0.8);}
    50%{opacity: 0.9; transform: scale(1.2);}
}

/* 极简流畅三层蛋糕 无白边 无草莓 */
.cake{
    position:relative;
    width:260px;
    height:240px;
}
.cake-layer1{
    position:absolute;
    bottom:0;
    left:50%;
    transform:translateX(-50%);
    width:260px;
    height:90px;
    background:#ffc8dd;
    border-radius:30px 30px 40px 40px;
}
.cake-layer2{
    position:absolute;
    bottom:75px;
    left:50%;
    transform:translateX(-50%);
    width:200px;
    height:75px;
    background:#ffb8cc;
    border-radius:25px 25px 35px 35px;
}
.cake-layer3{
    position:absolute;
    bottom:140px;
    left:50%;
    transform:translateX(-50%);
    width:140px;
    height:60px;
    background:#ffa8bc;
    border-radius:20px 20px 30px 30px;
}

/* 蛋糕缎带+蝴蝶结装饰 */
.cake-ribbon{
    position:absolute;
    width:100%;
    height:12px;
    background:#ffd7e2;
    left:0;
    opacity:0.8;
}
.rib1{bottom:78px;}
.rib2{bottom:145px;}

.cake-bow{
    position:absolute;
    width:36px;
    height:28px;
    background:#ffb8cc;
    left:50%;
    transform:translateX(-50%);
    border-radius:50%;
    opacity:0.9;
}
.bow1{bottom:60px;}
.bow2{bottom:130px;}

/* 三根蜡烛 紧凑居中 间距完全相等 */
.candle{
    position:absolute;
    width:9px;
    height:40px;
    background:#ffffff;
    border-radius:4px;
    z-index:2;
    bottom:202px;
}
.c1{left:calc(50% - 20px);}
.c2{left:50%; transform:translateX(-50%);}
.c3{left:calc(50% + 20px);}

.flame{
    width:12px;
    height:18px;
    background:linear-gradient(#ffdd00,#ff7700);
    border-radius:50% 50% 50% 50% / 60% 60% 40% 40%;
    margin:-14px auto 0;
    opacity:0;
    animation:flameAni 0.5s infinite alternate;
}
@keyframes flameAni{
    from{transform:scale(1);}
    to{transform:scale(1.15);}
}

/* 第二页中号居中文字 */
.main-txt{
    font-size:34px;
    color:#ff69b4;
    opacity:0;
    transition:opacity 1.2s ease;
    font-weight:bold;
    letter-spacing:2px;
    text-align:center;
}
.word-txt{
    font-size:18px;
    color:#d85a8c;
    line-height:2.2;
    text-align:center;
    max-width:80%;
    opacity:0;
    transition:opacity 1.2s ease;
}

/* 松散无重叠照片墙布局 */
.photo-wrap{
    position:relative;
    width:100%;
    height:100%;
}
.photo-card{
    width:150px;
    height:210px;
    position:absolute;
    border-radius:12px;
    overflow:hidden;
    background:#fff;
    opacity:0;
    transform:scale(0.85);
    transition:all 1s ease;
    box-shadow: 0 4px 12px rgba(255,105,180,0.25);
}
.photo-card.show{
    opacity:1;
    transform:scale(1) rotate(var(--r));
}
.photo-card img{
    width:100%;
    height:100%;
    object-fit:cover;
}
.bow{
    position:absolute;
    top:-8px;
    left:50%;
    transform:translateX(-50%);
    width:40px;
    height:40px;
    background:#ff69b4;
    clip-path:polygon(0 50%,25% 0,50% 50%,75% 0,100% 50%,75% 100%,50% 50%,25% 100%);
}
.lace{
    position:absolute;
    inset:0;
    border:6px dashed #ffc8dd;
    border-radius:12px;
    pointer-events:none;
}
.tip{
    color:#ff69b4;
    margin-top:30px;
    font-size:16px;
}
</style>
</head>

        <div class="cake-ribbon rib2"></div>
        <div class="cake-bow bow1"></div>
        <div class="cake-bow bow2"></div>

        <div class="candle c1"><div class="flame"></div></div>

        <div class="candle c3"><div class="flame"></div></div>

</div>

<!--第二页 居中中号文字-->
<div class="page" id="page2">
    <div class="star" style="top:20%;left:15%;animation-delay:0.3s;"></div>
    <div class="star" style="top:60%;left:80%;animation-delay:1s;"></div>
    <div class="star" style="top:35%;left:25%;animation-delay:1.8s;"></div>

    <div class="fly-bow" style="top:15%;left:20%;animation-delay:0.5s;"></div>
    <div class="fly-bow" style="top:30%;right:15%;animation-delay:1.5s;"></div>
    <div class="fly-bow" style="bottom:30%;right:25%;animation-delay:2.5s;"></div>

    <div class="main-txt" id="mainTxt">祝宁宁生日快乐 🎂</div>
</div>

<!--寄语页面-->
<div class="page" id="page3">
    <div class="star" style="top:18%;left:85%;animation-delay:0.5s;"></div>
    <div class="star" style="top:55%;left:12%;animation-delay:1.2s;"></div>
    <div class="star" style="top:80%;left:70%;animation-delay:2s;"></div>

    <div class="fly-bow" style="top:12%;left:18%;animation-delay:0.3s;"></div>
    <div class="fly-bow" style="top:25%;right:22%;animation-delay:1.2s;"></div>
    <div class="fly-bow" style="bottom:20%;left:30%;animation-delay:2s;"></div>

    <div class="word-txt" id="wordTxt">
To：宁<br><br>
生日快乐，让我想想该怎么对你说祝福呢？<br>
想对你说希望你无忧，可人生海海总是会有波澜的。<br>
那就祝你顺遂吧，祝你永远幸福永远自信，<br>
新的一岁喜乐安康，事事如意。
    </div>
</div>

<script>
let stage = 1;
const page1 = document.getElementById('page1');
const page2 = document.getElementById('page2');
const page3 = document.getElementById('page3');
const page4 = document.getElementById('page4');
const mainTxt = document.getElementById('mainTxt');
const wordTxt = document.getElementById('wordTxt');
const flames = document.querySelectorAll('.flame');
const photoCards = document.querySelectorAll('.photo-card');

const photoInterval = 1500;

document.onclick = function(){
    if(stage === 1){
        flames.forEach((f,i)=>{
            setTimeout(()=>f.style.opacity=1, i*200);
        });
        setTimeout(()=>{
            page1.style.display = 'none';
            page2.style.display = 'flex';
            page2.style.opacity = 1;
            stage = 2;
        },1200);
    }else if(stage === 2){
        mainTxt.style.opacity = 1;
        setTimeout(()=>{
            page2.style.opacity = 0;
            setTimeout(()=>{
                page2.style.display = 'none';
                page3.style.display = 'flex';
                page3.style.opacity = 1;
                stage = 3;
            },800);
        },1500);
    }else if(stage === 3){
        wordTxt.style.opacity = 1;
        setTimeout(()=>{
            page3.style.opacity = 0;
            setTimeout(()=>{
                page3.style.display = 'none';
                page4.style.display = 'flex';
                page4.style.opacity = 1;
                stage = 4;
                photoCards.forEach((card, idx)=>{
                    setTimeout(()=>{
                        card.classList.add('show');
                    }, idx * photoInterval);
                });
            },800);
        },4500);
    }
}
</script>
